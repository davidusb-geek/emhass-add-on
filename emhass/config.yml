name: EMHASS
description: Energy Management for Home Assistant
url: https://github.com/davidusb-geek/emhass
version: v0.19.0 #set if use image container version
slug: emhass
arch:
  - aarch64
  - amd64
  # - armhf
  # - armv7
image: "ghcr.io/davidusb-geek/emhass" #set if use image container repository
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: Web interface and API
webui: http://[HOST]:[PORT:5000]
map:
  - share:rw
  - type: addon_config
    path: /config
    read_only: False
init: false
hassio_role: default
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:home-lightning-bolt-outline
panel_title: EMHASS
panel_admin: true
options:
  remote_solver_tokens: [] # a list must have its default: none
schema:
  hass_url: "str?" #optional
  long_lived_token: "password?" #optional
  emhass_api_token: "password?" #optional
  participant_token: "password?" #optional, the token a coordinator presents to this EMHASS
  remote_solver_tokens: # the tokens of the remote solvers the site names, each under its token_secret
    - name: "match(^[a-z][a-z0-9_]{0,31}$)"
      token: "password"
  data_path: "list(default|/config|/data|/share|/share/emhass)?" #optional
  config_path: "list(default|/config/config.json|/share/config.json|/share/emhass/config.json)?" #optional
  time_zone: "match((\\w+)?(\\/)(\\w+))?" #optional
  Latitude: "float?" #optional
  Longitude: "float?" #optional
  Altitude: "float?" #optional
  solcast_api_key: "password?" #optional
  solcast_rooftop_id: "str?" #optional
  solar_forecast_kwp: "float?" #optional
  server_ip: "list(0.0.0.0|127.0.0.1)?" #optional
  influxdb_username: "str?" #optional
  influxdb_password: "password?" #optional
  victoriametrics_username: "str?" #optional
  victoriametrics_password: "password?" #optional